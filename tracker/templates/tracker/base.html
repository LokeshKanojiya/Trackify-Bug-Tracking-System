{% load static %}
<!DOCTYPE html>
<html>
<head>

<title>{% block title %}Bug Tracker{% endblock %}</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;

/* Trackify background */

background-image: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url("{% static 'images/newtt.jpeg' %}");


background-size:cover;
background-position:center;
background-repeat:no-repeat;

}

/* Sidebar */

.sidebar{

position:fixed;
top:0;
left:0;

width:220px;
height:100vh;

background:linear-gradient(180deg,#1e2a2f,#34495e);

color:white;

padding:25px;

}

.sidebar h3{
margin-bottom:35px;
font-weight:600;
}

.sidebar a{

display:block;

color:white;

text-decoration:none;

padding:12px 15px;

margin-bottom:15px;

border-radius:8px;

transition:0.2s;

}

.sidebar a:hover{

background:rgba(255,255,255,0.15);

}

/* Main content */

.main-content{

margin-left:220px;

padding:40px;

min-height:100vh;
background: rgba(255,255,255,0.15);
backdrop-filter: blur(3px);
-webkit-backdrop-filter: blur(3px);

}

/* Card glass effect */

.card{

background:rgba(255,255,255,0.9);

border-radius:10px;

}
.project-card{

background: rgba(111, 108, 108, 0.9);

border-radius:15px;

padding:10px;

border:2px solid rgba(0,123,255,0.4);

transition: all 0.3s ease;

box-shadow:0 10px 25px rgba(0,0,0,0.15);

}

.project-card:hover{

transform: translateY(-8px) scale(1.02);

box-shadow:0 20px 40px rgba(0,0,0,0.25);

border-color:#0d6efd;

}

/* User box */

.user-box{

position:absolute;

bottom:25px;

left:25px;

right:25px;

background:rgba(255,255,255,0.15);

padding:15px;

border-radius:10px;

text-align:center;

}

.user-box p{
margin:0;
margin-bottom:10px;
color:white;
}

.menu-links{
    margin-top: 150px;
}

.sidebar-logo{
    width: 160px;
    margin-bottom: 20px;
    border-radius: 10px;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
}

.logo-container{
    margin-bottom: 10px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div class="logo-container text-center">
    <img src="{% static 'images/tt.jpeg' %}" class="sidebar-logo">
</div>

<div class="menu-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'project_list' %}">Projects</a>
    <a href="{% url 'ticket_list' %}">Tickets</a>
</div>


<div class="user-box">

<p>{{ user.username }} ({{ user.role }})</p>

<form method="post" action="{% url 'logout' %}">
{% csrf_token %}
<button type="submit" class="btn btn-light btn-sm">Logout</button>
</form>

</div>

</div>


<!-- Main Page Content -->

<div class="main-content">

{% block content %}
{% endblock %}

</div>


</body>
</html>
