{% load static %}
<!DOCTYPE html>
<html>

<head>
<title>Trackify</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* Background */

body{
height:100vh;

background-image: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url("{% static 'images/wavy.jpg' %}");
background-size: cover;
background-position: center;
background-repeat: no-repeat;

display:flex;
justify-content:center;
align-items:center;

font-family:'Poppins',sans-serif;
color:white;
overflow:hidden;
}


/* Floating Particles */

.particles{

position:absolute;
width:100%;
height:100%;

background-image:
radial-gradient(circle at 20% 30%, rgba(0,212,255,0.2) 2px, transparent 2px),
radial-gradient(circle at 80% 70%, rgba(0,212,255,0.2) 2px, transparent 2px),
radial-gradient(circle at 40% 80%, rgba(0,212,255,0.2) 2px, transparent 2px);

background-size:200px 200px;

animation: moveParticles 25s linear infinite;

pointer-events:none;

}

@keyframes moveParticles{

from{ background-position:0 0; }

to{ background-position:1000px 500px; }

}


/* Left Side Text */

.left-text{
position:absolute;
left:120px;
top:50%;
transform:translateY(-50%);
max-width:350px;
}

.left-text h1{
font-size:48px;
font-weight:700;
margin-bottom:10px;
text-shadow:0 0 15px rgba(0,212,255,0.7);
}

.left-text p{
font-size:18px;
opacity:0.85;
}


/* Login Card */

.login-card{

width:420px;
padding:45px;

background: rgba(0,0,0,0.25);

backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);

border-radius:30px;

border:1px solid rgba(255,255,255,0.25);

box-shadow:0 25px 45px rgba(0,0,0,0.3);

color:white;

animation: floatCard 6s ease-in-out infinite;

}

@keyframes floatCard{

0%{ transform: translateY(0px); }

50%{ transform: translateY(-12px); }

100%{ transform: translateY(0px); }

}


/* Title */

.login-title{
text-align:center;
margin-bottom:25px;
font-weight:bold;
}


/* Button */

.login-button{

background: linear-gradient(135deg,#00c6ff,#0072ff);

border:none;

letter-spacing:1px;
font-weight:bold;

transition:0.3s;

box-shadow:0 0 10px rgba(0,212,255,0.5);

}

.login-button:hover{

transform:translateY(-3px);

box-shadow:0 0 20px rgba(0,212,255,0.9);

}


</style>

</head>


<body>

<!-- Floating particles -->
<div class="particles"></div>


<!-- LEFT SIDE TEXT -->

<div class="left-text">
<h1>Trackify</h1>
<p>Track bugs. Manage issues. Ship better code.</p>
</div>


<!-- LOGIN CARD -->

<div class="login-card">

<h3 class="login-title">Sign in to continue</h3>

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label>Username</label>
<input type="text" name="username" class="form-control">
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control">
</div>

<button type="submit" class="btn login-button w-100">
Login
</button>

<p class="text-center mt-3">
Don't have an account?<a href="{% url 'register' %}">Register</a>
</p>

</form>

</div>

</body>
</html>
