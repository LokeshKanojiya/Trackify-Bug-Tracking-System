{% extends 'tracker/base.html' %}
{% block title %}Create Project - Bug Tracker{% endblock %}
{% block content %}
<h2>Create Project</h2>
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary mt-2">Save Project</button>
            <a href="{% url 'project_list' %}" class="btn btn-secondary mt-2 ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
