{% load static %}
<!DOCTYPE html>
<html>

<head>

<title>Trackify - Register</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
height:100vh;

background-image: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url("{% static 'images/wavy.jpg' %}");
background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

font-family:'Poppins',sans-serif;
color:white;
}

/* Glass Card */

.register-card{

width:420px;
padding:40px;

background: rgba(0,0,0,0.35);

backdrop-filter: blur(15px);

border-radius:25px;

border:1px solid rgba(255,255,255,0.25);

box-shadow:0 25px 45px rgba(0,0,0,0.4);

color:white;

}

/* Title */

.register-title{

text-align:center;
font-weight:600;
margin-bottom:20px;

}

/* Inputs */

.form-control, .form-select{

background: rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.25);
color:white;

}

.form-control:focus, .form-select:focus{

background: rgba(255,255,255,0.15);
border-color:#00d4ff;
box-shadow:none;
color:white;

}

/* Help text */

.form-text{
color:#ccc;
font-size:12px;
}

/* Button */

.register-button{

background: linear-gradient(135deg,#00c6ff,#0072ff);
border:none;
font-weight:bold;
letter-spacing:1px;

}

.register-button:hover{

transform:translateY(-2px);
box-shadow:0 0 15px rgba(0,212,255,0.7);

}

a{
color:#00d4ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="register-card">

<h3 class="register-title">Create your Trackify account</h3>

<form method="post">

{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label class="form-label">{{ field.label }}</label>

{{ field }}

{% if field.help_text %}
<div class="form-text">
{{ field.help_text }}
</div>
{% endif %}

{% if field.errors %}
<div class="text-danger small">
{{ field.errors }}
</div>
{% endif %}

</div>

{% endfor %}

<button type="submit" class="btn register-button w-100">
Register
</button>

</form>

<p class="text-center mt-3">
Already have an account?
<a href="{% url 'login' %}">Login</a>
</p>

</div>

</body>
</html>
